<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #E50914;
            --bg: #0f0f0f;
            --sidebar: #161616;
            --card: #1e1e1e;
            --text: #f0f0f0;
            --text-dim: #a0a0a0;
            --leo: #2196F3;
            --emi: #E91E63;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            height: 100vh;
            overflow: hidden;
        }

        /* NAVEGAÇÃO ESTILO DASHBOARD */
        .sidebar {
            width: 240px;
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #222;
        }

        .logo { font-weight: 800; color: var(--primary); font-size: 1.2rem; margin-bottom: 40px; text-align: center; }

        .nav-group { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn {
            background: transparent;
            color: var(--text-dim);
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-btn.active { background: #252525; color: white; border-left: 4px solid var(--primary); }
        .nav-btn:hover:not(.active) { background: #1e1e1e; color: white; }

        /* ÁREA PRINCIPAL */
        main { flex: 1; overflow-y: auto; padding: 30px; position: relative; scrollbar-width: none; }
        .section { display: none; max-width: 800px; margin: 0 auto; animation: fadeInUp 0.4s ease; }
        .section.active { display: block; }

        /* CARDS */
        .glass-card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid #2a2a2a; margin-bottom: 20px; }
        
        /* MENSAGENS INÍCIO */
        .msg-input textarea { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; font-size: 1rem; outline: none; }
        .msg-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid var(--primary); }
        
        /* FILMES GRID */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; list-style: none; padding: 0; }
        .movie-card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #2a2a2a; transition: 0.3s; position: relative; }
        .movie-card:hover { transform: translateY(-5px); border-color: #444; }
        .poster-img { width: 100%; height: 260px; object-fit: cover; }
        
        /* CRÍTICAS ESTILO CHAT */
        .critic-box { padding: 12px; font-size: 0.85rem; border-top: 1px solid #2a2a2a; }
        .stars { margin-bottom: 5px; cursor: pointer; font-size: 1.1rem; }
        .star { color: #333; }
        .star.gold { color: #FFD700; }
        .chat-bubble { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .chat-tools { display: flex; gap: 8px; opacity: 0.4; }
        .chat-tools button { background: none; border: none; color: white; cursor: pointer; font-size: 0.8rem; }

        /* RESPONSIVIDADE CELULAR */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; order: 2; padding: 0 10px; border-right: none; border-top: 1px solid #222; position: fixed; bottom: 0; }
            .logo { display: none; }
            .nav-group { flex-direction: row; width: 100%; justify-content: space-around; }
            .nav-btn { flex-direction: column; font-size: 0.7rem; padding: 8px; gap: 4px; }
            main { padding: 15px; padding-bottom: 90px; order: 1; }
            .movie-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .poster-img { height: 220px; }
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">NOSSO DASH ❤️</div>
        <nav class="nav-group">
            <button class="nav-btn active" onclick="nav('inicio', this)"><span>🏠</span> Início</button>
            <button class="nav-btn" onclick="nav('filmes', this)"><span>🍿</span> Filmes</button>
            <button class="nav-btn" onclick="nav('desenhos', this)"><span>🎨</span> Desenhos</button>
            <button class="nav-btn" onclick="nav('vales', this)"><span>🎟️</span> Vales</button>
        </nav>
    </aside>

    <main>
        <!-- SEÇÃO INÍCIO -->
        <section id="sec-inicio" class="section active">
            <h2 style="margin-top:0">Recadinhos Digitais</h2>
            <div class="glass-card msg-input">
                <textarea id="msg-text" placeholder="Escreva algo especial..." rows="2"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button onclick="saveMessage('LÉO')" style="flex:1; background:var(--leo); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">LÉO</button>
                    <button onclick="saveMessage('EMI')" style="flex:1; background:var(--emi); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">EMI</button>
                </div>
            </div>
            <div id="msg-list"></div>
        </section>

        <!-- SEÇÃO FILMES -->
        <section id="sec-filmes" class="section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="margin:0">Cine Casal</h2>
                <button onclick="drawMovie()" style="background:#333; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">🎲 Sorteio</button>
            </div>

            <div class="glass-card">
                <input type="text" id="movieInput" placeholder="🔍 Buscar filme para adicionar..." style="width:100%; background:transparent; border:none; color:white; font-size:1rem; outline:none;">
                <div id="suggestions" style="margin-top:10px;"></div>
            </div>

            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <button onclick="filterMovie('todo')" id="btn-todo" style="background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:20px; font-size:0.8rem; font-weight:600; cursor:pointer;">Para Ver</button>
                <button onclick="filterMovie('watched')" id="btn-watched" style="background:#222; color:white; border:none; padding:8px 15px; border-radius:20px; font-size:0.8rem; font-weight:600; cursor:pointer;">Já Vistos</button>
            </div>

            <ul id="list-todo" class="movie-grid active"></ul>
            <ul id="list-watched" class="movie-grid" style="display:none"></ul>
            <div id="draw-result"></div>
        </section>

        <!-- EM BREVE -->
        <section id="sec-desenhos" class="section"><center><h2>Em breve: Galeria de Desenhos 🎨</h2></center></section>
        <section id="sec-vales" class="section"><center><h2>Em breve: Seus Vales 🎟️</h2></center></section>
    </main>

    <script>
        const SUPABASE_URL = 'https://surcxurqjaelqudeqzic.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmN4dXJxamFlbHF1ZGVxemljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTk2NTYsImV4cCI6MjA4MTQ3NTY1Nn0.Ab0BRqSbqoWyb7A5lQMDNW9iBjb0FBxv27MhnZ8L8tk'; 
        const TMDB_API_KEY = 'c96d86cf59c6c7fb0af651ec5059bcbf';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let cachedMovies = [];

        function nav(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            btn.classList.add('active');
        }

        function filterMovie(type) {
            document.getElementById('list-todo').style.display = type === 'todo' ? 'grid' : 'none';
            document.getElementById('list-watched').style.display = type === 'watched' ? 'grid' : 'none';
            document.getElementById('btn-todo').style.background = type === 'todo' ? 'var(--primary)' : '#222';
            document.getElementById('btn-watched').style.background = type === 'watched' ? 'var(--primary)' : '#222';
        }

        // --- MENSAGENS ---
        async function saveMessage(author) {
            const input = document.getElementById('msg-text');
            if(!input.value.trim()) return;
            await _supabase.from('messages').insert([{ text: input.value, author }]);
            input.value = '';
            loadMessages();
        }

        async function loadMessages() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            document.getElementById('msg-list').innerHTML = data.map(m => `
                <div class="msg-card" style="border-color: ${m.author === 'LÉO' ? 'var(--leo)' : 'var(--emi)'}">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; font-weight:bold; margin-bottom:5px; color:${m.author === 'LÉO' ? 'var(--leo)' : 'var(--emi)'}">
                        <span>${m.author}</span>
                        <div style="display:flex; gap:10px">
                            <button onclick="editMsg('${m.id}', \`${m.text}\`)" style="background:none;border:none;color:#555;cursor:pointer">✏️</button>
                            <button onclick="delMsg('${m.id}')" style="background:none;border:none;color:#555;cursor:pointer">🗑️</button>
                        </div>
                    </div>
                    <div>${m.text}</div>
                    <div style="font-size:0.6rem; color:#555; margin-top:8px">${new Date(m.created_at).toLocaleString('pt-BR')}</div>
                </div>
            `).join('');
        }
        async function delMsg(id) { if(confirm("Apagar?")) { await _supabase.from('messages').delete().eq('id', id); loadMessages(); } }
        async function editMsg(id, old) { const n = prompt("Editar mensagem:", old); if(n) { await _supabase.from('messages').update({ text: n }).eq('id', id); loadMessages(); } }

        // --- FILMES ---
        async function loadMovies() {
            const { data } = await _supabase.from('movies').select('*').order('created_at', { ascending: false });
            if(!data) return;
            cachedMovies = data;
            const todo = document.getElementById('list-todo');
            const watched = document.getElementById('list-watched');
            todo.innerHTML = ''; watched.innerHTML = '';

            data.forEach(m => {
                const li = document.createElement('li');
                li.className = 'movie-card';
                if(m.watched) {
                    li.innerHTML = `
                        <img src="${m.poster}" class="poster-img" style="filter:grayscale(1); opacity:0.4">
                        <div style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.7); padding:4px 8px; border-radius:6px; font-size:0.6rem">VISTO</div>
                        <div style="padding:10px; font-size:0.8rem; font-weight:bold">${m.title}</div>
                        <div class="critic-box" style="background:rgba(33,150,243,0.05)">${renderCritic(m, 1, 'LÉO')}</div>
                        <div class="critic-box" style="background:rgba(233,30,99,0.05)">${renderCritic(m, 2, 'EMI')}</div>
                        <button onclick="toggleWatched('${m.id}', false)" style="width:100%; background:#222; border:none; color:white; padding:8px; font-size:0.7rem; cursor:pointer">Voltar para Ver</button>
                    `;
                    watched.appendChild(li);
                } else {
                    li.innerHTML = `
                        <img src="${m.poster}" class="poster-img">
                        <div style="padding:10px; font-size:0.8rem; font-weight:bold">${m.title}</div>
                        <div style="display:flex; border-top:1px solid #2a2a2a">
                            <button onclick="toggleWatched('${m.id}', true)" style="flex:1; background:transparent; color:white; border:none; padding:10px; border-right:1px solid #2a2a2a; cursor:pointer">✔️ Ver</button>
                            <button onclick="delMov('${m.id}')" style="flex:1; background:transparent; color:white; border:none; padding:10px; cursor:pointer">🗑️</button>
                        </div>
                    `;
                    todo.appendChild(li);
                }
            });
        }

        function renderCritic(movie, pNum, name) {
            const rating = movie[`rating_${pNum}`] || 0;
            const revs = (movie[`review_${pNum}`] || "").split('|||').filter(r => r);
            let s = ''; for(let i=1; i<=5; i++) s += `<span class="star ${i<=rating?'gold':''}" onclick="upRate('${movie.id}', ${pNum}, ${i})">★</span>`;
            return `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px">
                    <span style="font-size:0.6rem; font-weight:900; opacity:0.5">${name}</span>
                    <div class="stars">${s}</div>
                </div>
                <div>${revs.map((r, i) => `<div class="chat-bubble"><span>${r}</span><div class="chat-tools"><button onclick="editRev('${movie.id}', ${pNum}, ${i})">✏️</button><button onclick="delRev('${movie.id}', ${pNum}, ${i})">✕</button></div></div>`).join('')}</div>
                <div style="display:flex; gap:5px; margin-top:5px">
                    <input type="text" id="in-${pNum}-${movie.id}" placeholder="Nota..." style="flex:1; background:#000; border:1px solid #333; color:white; padding:5px; border-radius:5px; font-size:0.7rem">
                    <button onclick="addRev('${movie.id}', ${pNum})" style="background:var(--primary); color:white; border:none; padding:5px 10px; border-radius:5px; font-size:0.7rem">➤</button>
                </div>
            `;
        }

        async function upRate(id, p, r) { const up = {}; up[`rating_${p}`] = r; await _supabase.from('movies').update(up).eq('id', id); loadMovies(); }
        async function addRev(id, p) {
            const val = document.getElementById(`in-${p}-${id}`).value.trim(); if(!val) return;
            const m = cachedMovies.find(x => x.id == id);
            const up = {}; up[`review_${p}`] = m[`review_${p}`] ? m[`review_${p}`] + "|||" + val : val;
            await _supabase.from('movies').update(up).eq('id', id); loadMovies();
        }
        async function delRev(id, p, i) {
            const m = cachedMovies.find(x => x.id == id); let r = m[`review_${p}`].split('|||'); r.splice(i, 1);
            const up = {}; up[`review_${p}`] = r.join('|||'); await _supabase.from('movies').update(up).eq('id', id); loadMovies();
        }
        async function editRev(id, p, i) {
            const m = cachedMovies.find(x => x.id == id); let r = m[`review_${p}`].split('|||');
            const n = prompt("Editar comentário:", r[i]);
            if(n) { r[i] = n; const up = {}; up[`review_${p}`] = r.join('|||'); await _supabase.from('movies').update(up).eq('id', id); loadMovies(); }
        }

        async function toggleWatched(id, s) { await _supabase.from('movies').update({ watched: s }).eq('id', id); loadMovies(); }
        async function delMov(id) { if(confirm("Excluir filme?")) { await _supabase.from('movies').delete().eq('id', id); loadMovies(); } }

        // BUSCA TMDB
        document.getElementById('movieInput').oninput = async function() {
            if(this.value.length < 3) { document.getElementById('suggestions').style.display = 'none'; return; }
            const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${this.value}&language=pt-BR`);
            const d = await r.json();
            const sugg = document.getElementById('suggestions');
            sugg.style.display = 'block';
            sugg.innerHTML = d.results.slice(0,4).map(m => `<div onclick="addMov('${m.title.replace(/'/g,"")}', 'https://image.tmdb.org/t/p/w185${m.poster_path}')" style="padding:10px; border-bottom:1px solid #333; cursor:pointer; font-size:0.8rem">${m.title}</div>`).join('');
        }
        async function addMov(t, p) {
            await _supabase.from('movies').insert([{ title: t, poster: p, watched: false }]);
            document.getElementById('suggestions').style.display = 'none'; document.getElementById('movieInput').value = ''; loadMovies();
        }

        function drawMovie() {
            const avail = cachedMovies.filter(m => !m.watched);
            if(avail.length === 0) return alert("Lista vazia!");
            const win = avail[Math.floor(Math.random() * avail.length)];
            document.getElementById('draw-result').innerHTML = `
                <div class="glass-card" style="text-align:center; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:1000; width:250px;">
                    <img src="${win.poster}" style="width:100%; border-radius:10px">
                    <p>${win.title}</p>
                    <button onclick="document.getElementById('draw-result').innerHTML=''" style="background:var(--primary); color:white; border:none; padding:10px; width:100%; border-radius:8px">Fechar</button>
                </div>
            `;
        }

        window.onload = () => {
            loadMessages(); loadMovies();
            _supabase.channel('m').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, loadMessages).subscribe();
            _supabase.channel('mov').on('postgres_changes', {event:'*', schema:'public', table:'movies'}, loadMovies).subscribe();
        };
    </script>
</body>
</html>
