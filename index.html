<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #0d0d0d;
            --sidebar: #161616;
            --card: #1e1e1e;
            --text: #f0f0f0;
            --leo: #2196F3;
            --eme: #ff758f;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar { width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; }
        .logo { font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 1.8rem; margin-bottom: 40px; text-align: center; }
        .nav-group { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn {
            background: transparent; color: #888; border: none; padding: 12px 15px; border-radius: 12px;
            cursor: pointer; text-align: left; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .nav-btn.active { background: #252525; color: white; border-left: 4px solid var(--primary); }

        /* MAIN */
        main { flex: 1; overflow-y: auto; padding: 30px; position: relative; scrollbar-width: none; }
        .section { display: none; max-width: 800px; margin: 0 auto; animation: slideUp 0.5s ease-out; }
        .section.active { display: block; }

        /* MURAL INÍCIO */
        .msg-input-container { background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%); padding: 20px; border-radius: 20px; margin-bottom: 30px; border: 1px solid #333; }
        .msg-input-container textarea { width: 100%; background: rgba(0,0,0,0.3); border: 2px dashed #444; color: white; padding: 15px; border-radius: 15px; outline: none; }
        .msg-card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; animation: popIn 0.4s ease; border-top: 4px solid var(--primary); }
        .msg-body { font-family: 'Dancing Script', cursive; font-size: 1.4rem; color: #fff; margin: 10px 0; }

        /* FILMES */
        .sub-nav-filmes { display: flex; gap: 8px; margin-bottom: 20px; background: #161616; padding: 5px; border-radius: 50px; }
        .sub-nav-btn { flex: 1; border: none; background: transparent; color: #666; padding: 10px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .sub-nav-btn.active { background: #333; color: white; }

        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; list-style: none; padding: 0; }
        .movie-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #2a2a2a; }
        .poster-img { width: 100%; height: 260px; object-fit: cover; }

        /* SORTEIO TAB */
        .draw-container { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        .genre-select { width: 100%; padding: 15px; background: #000; color: white; border: 1px solid #444; border-radius: 12px; margin-bottom: 20px; font-size: 1rem; }
        .btn-spin { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 800; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3); }

        /* PARTICLES & ANIMS */
        .heart { position: fixed; font-size: 20px; pointer-events: none; animation: fly 2s linear forwards; }
        @keyframes popIn { from { opacity:0; transform: scale(0.9); } to { opacity:1; transform: scale(1); } }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        @keyframes fly { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(0); opacity: 0; } }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; position: fixed; bottom: 0; border-top: 1px solid #222; justify-content: space-around; z-index: 1000; padding: 0; }
            .logo { display: none; }
            .nav-btn { flex-direction: column; font-size: 0.7rem; flex: 1; justify-content: center; align-items: center; }
            main { padding: 15px 15px 90px 15px; order: 1; }
            .movie-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Léo & Eme ✨</div>
        <nav class="nav-group">
            <button class="nav-btn active" onclick="nav('inicio', this)"><span>🏠</span> Início</button>
            <button class="nav-btn" onclick="nav('filmes', this)"><span>🍿</span> Filmes</button>
            <button class="nav-btn" onclick="nav('desenhos', this)"><span>🎨</span> Desenhos</button>
            <button class="nav-btn" onclick="nav('vales', this)"><span>🎟️</span> Vales</button>
        </nav>
    </aside>

    <main>
        <!-- SEÇÃO INÍCIO -->
        <section id="sec-inicio" class="section active">
            <h2 style="font-family: 'Dancing Script'; font-size: 2.2rem; color: var(--primary); text-align: center;">Mural de Afeto</h2>
            <div class="msg-input-container">
                <textarea id="msg-text" placeholder="Escreva algo fofo..." rows="2"></textarea>
                <div style="display: flex; gap: 15px; margin-top: 15px;">
                    <button onclick="saveMsg('LÉO')" style="flex:1; background:var(--leo); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; cursor:pointer;">LÉO</button>
                    <button onclick="saveMsg('EME')" style="flex:1; background:var(--eme); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; cursor:pointer;">EME</button>
                </div>
            </div>
            <div id="msg-list"></div>
        </section>

        <!-- SEÇÃO FILMES -->
        <section id="sec-filmes" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem; margin-bottom: 20px;">Nosso Cinema</h2>
            
            <div class="sub-nav-filmes">
                <button class="sub-nav-btn active" onclick="movTab('todo', this)">Para Ver</button>
                <button class="sub-nav-btn" onclick="movTab('watched', this)">Já Vistos</button>
                <button class="sub-nav-btn" onclick="movTab('sorteio', this)">🎲 Sorteio</button>
            </div>

            <!-- Conteúdo: Listas -->
            <div id="filmes-lista-area">
                <div id="search-bar-filme">
                    <input type="text" id="movieInput" placeholder="🔍 Adicionar novo filme..." style="width:100%; background:#1e1e1e; border:1px solid #333; color:white; padding:15px; border-radius:15px; margin-bottom:20px;">
                    <div id="suggestions" style="margin-top:-15px; margin-bottom:15px; display:none; background:#1e1e1e; border-radius:12px; padding:10px; border: 1px solid #333;"></div>
                </div>
                <ul id="list-todo" class="movie-grid"></ul>
                <ul id="list-watched" class="movie-grid" style="display:none"></ul>
            </div>

            <!-- Conteúdo: Sorteio -->
            <div id="filmes-sorteio-area" style="display:none">
                <div class="draw-container">
                    <h3 style="margin-top:0">O que vamos assistir?</h3>
                    <p style="color:#666; font-size:0.9rem">O sorteio escolhe apenas filmes da sua lista "Para Ver"</p>
                    
                    <select id="genre-selector" class="genre-select">
                        <option value="all">🎲 Todos os Gêneros</option>
                        <option value="Ação">💥 Ação</option>
                        <option value="Aventura">🗺️ Aventura</option>
                        <option value="Animação">🧸 Animação</option>
                        <option value="Comédia">😂 Comédia</option>
                        <option value="Terror">👻 Terror</option>
                        <option value="Romance">💘 Romance</option>
                        <option value="Ficção">👽 Ficção Científica</option>
                        <option value="Drama">🎭 Drama</option>
                    </select>

                    <button class="btn-spin" onclick="spinRoleta()">GIRAR ROLETA 🎰</button>

                    <div id="draw-result" style="margin-top:25px"></div>
                </div>
            </div>
        </section>

        <!-- EM BREVE -->
        <section id="sec-desenhos" class="section"><center><h2 style="font-family:'Dancing Script'">Galeria de Desenhos vindo aí... 🎨</h2></center></section>
        <section id="sec-vales" class="section"><center><h2 style="font-family:'Dancing Script'">Seus Vales vindo aí... 🎟️</h2></center></section>
    </main>

    <script>
        const SUPABASE_URL = 'https://surcxurqjaelqudeqzic.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmN4dXJxamFlbHF1ZGVxemljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTk2NTYsImV4cCI6MjA4MTQ3NTY1Nn0.Ab0BRqSbqoWyb7A5lQMDNW9iBjb0FBxv27MhnZ8L8tk'; 
        const TMDB_API_KEY = 'c96d86cf59c6c7fb0af651ec5059bcbf';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let cachedMovies = [];

        // NAV GLOBAL
        function nav(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            btn.classList.add('active');
        }

        // NAV FILMES
        function movTab(t, btn) {
            document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            document.getElementById('filmes-lista-area').style.display = t === 'sorteio' ? 'none' : 'block';
            document.getElementById('filmes-sorteio-area').style.display = t === 'sorteio' ? 'block' : 'none';
            
            if(t !== 'sorteio') {
                document.getElementById('list-todo').style.display = t === 'todo' ? 'grid' : 'none';
                document.getElementById('list-watched').style.display = t === 'watched' ? 'grid' : 'none';
                document.getElementById('search-bar-filme').style.display = t === 'todo' ? 'block' : 'none';
            }
        }

        // --- MURAL ---
        async function saveMsg(author) {
            const input = document.getElementById('msg-text');
            if(!input.value.trim()) return;
            await _supabase.from('messages').insert([{ text: input.value, author }]);
            input.value = ''; createHearts(); loadMessages();
        }
        function createHearts() {
            for(let i=0; i<15; i++) {
                const h = document.createElement('div'); h.className = 'heart'; h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw'; h.style.top = '90vh';
                document.body.appendChild(h); setTimeout(() => h.remove(), 2000);
            }
        }
        async function loadMessages() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            document.getElementById('msg-list').innerHTML = data.map(m => `
                <div class="msg-card" style="border-color: ${m.author === 'LÉO' ? 'var(--leo)' : 'var(--eme)'}">
                    <div style="display:flex; justify-content:space-between; font-size:0.7rem; font-weight:800; color:${m.author === 'LÉO' ? 'var(--leo)' : 'var(--eme)'}">
                        <span>${m.author}</span>
                        <div>
                            <button onclick="editMsg('${m.id}', \`${m.text}\`)" style="background:none;border:none;color:#555;cursor:pointer">✏️</button>
                            <button onclick="delMsg('${m.id}')" style="background:none;border:none;color:#555;cursor:pointer">🗑️</button>
                        </div>
                    </div>
                    <div class="msg-body">${m.text}</div>
                    <div style="font-size:0.6rem; opacity:0.3; text-align:right">${new Date(m.created_at).toLocaleString('pt-BR')}</div>
                </div>
            `).join('');
        }
        async function delMsg(id) { if(confirm("Apagar?")) { await _supabase.from('messages').delete().eq('id', id); loadMessages(); } }
        async function editMsg(id, old) { const n = prompt("Editar:", old); if(n) { await _supabase.from('messages').update({ text: n }).eq('id', id); loadMessages(); } }

        // --- FILMES ---
        async function loadMovies() {
            const { data } = await _supabase.from('movies').select('*').order('created_at', { ascending: false });
            cachedMovies = data || [];
            const todo = document.getElementById('list-todo');
            const watched = document.getElementById('list-watched');
            todo.innerHTML = ''; watched.innerHTML = '';

            cachedMovies.forEach(m => {
                const li = document.createElement('li'); li.className = 'movie-card';
                if(m.watched) {
                    li.innerHTML = `
                        <img src="${m.poster}" class="poster-img" style="filter:grayscale(1); opacity:0.4">
                        <div style="padding:10px">
                            <div style="font-size:0.8rem; font-weight:bold; margin-bottom:8px">${m.title}</div>
                            ${renderCritic(m, 1, 'LÉO')}
                            ${renderCritic(m, 2, 'EME')}
                        </div>
                        <button onclick="toggleW('${m.id}', false)" style="width:100%; padding:8px; background:#222; color:white; border:none; cursor:pointer; font-size:0.7rem">↩ Ver de novo</button>
                    `;
                    watched.appendChild(li);
                } else {
                    li.innerHTML = `
                        <img src="${m.poster}" class="poster-img">
                        <div style="padding:10px; font-size:0.8rem; font-weight:bold">${m.title}</div>
                        <div style="display:flex; border-top:1px solid #333">
                            <button onclick="toggleW('${m.id}', true)" style="flex:1; padding:12px; background:transparent; color:white; border:none; border-right:1px solid #333; cursor:pointer">✔️</button>
                            <button onclick="delMov('${m.id}')" style="flex:1; padding:12px; background:transparent; color:white; border:none; cursor:pointer">🗑️</button>
                        </div>
                    `;
                    todo.appendChild(li);
                }
            });
        }

        function renderCritic(movie, p, name) {
            const r = movie[`rating_${p}`] || 0;
            const revs = (movie[`review_${p}`] || "").split('|||').filter(x => x);
            let stars = ''; for(let i=1; i<=5; i++) stars += `<span onclick="upRate('${movie.id}', ${p}, ${i})" style="cursor:pointer; color:${i<=r?'#FFD700':'#333'}">★</span>`;
            return `
                <div style="background:rgba(255,255,255,0.02); padding:6px; border-radius:8px; margin-bottom:5px">
                    <div style="display:flex; justify-content:space-between; font-size:0.6rem; margin-bottom:3px"><b>${name}</b> <div>${stars}</div></div>
                    <div style="font-size:0.7rem">${revs.map((txt, i) => `<div style="display:flex; justify-content:space-between; margin:2px 0"><span>- ${txt}</span> <div style="display:flex; gap:4px"><button onclick="editRev('${movie.id}', ${p}, ${i})" style="background:none;border:none;color:#444;font-size:0.6rem">✏️</button><button onclick="delRev('${movie.id}', ${p}, ${i})" style="background:none;border:none;color:#444;font-size:0.6rem">✕</button></div></div>`).join('')}</div>
                    <div style="display:flex; gap:4px; margin-top:4px">
                        <input type="text" id="in-${p}-${movie.id}" placeholder="..." style="flex:1; background:#000; border:1px solid #333; color:white; padding:3px; border-radius:4px; font-size:0.6rem">
                        <button onclick="addRev('${movie.id}', ${p})" style="background:var(--primary); color:white; border:none; padding:3px 6px; border-radius:4px; font-size:0.6rem">➤</button>
                    </div>
                </div>
            `;
        }

        async function upRate(id, p, r) { const up = {}; up[`rating_${p}`] = r; await _supabase.from('movies').update(up).eq('id', id); loadMovies(); }
        async function addRev(id, p) {
            const val = document.getElementById(`in-${p}-${id}`).value.trim(); if(!val) return;
            const m = cachedMovies.find(x => x.id == id);
            const up = {}; up[`review_${p}`] = m[`review_${p}`] ? m[`review_${p}`] + "|||" + val : val;
            await _supabase.from('movies').update(up).eq('id', id); loadMovies();
        }
        async function delRev(id, p, i) {
            const m = cachedMovies.find(x => x.id == id); let r = m[`review_${p}`].split('|||'); r.splice(i, 1);
            const up = {}; up[`review_${p}`] = r.join('|||'); await _supabase.from('movies').update(up).eq('id', id); loadMovies();
        }
        async function editRev(id, p, i) {
            const m = cachedMovies.find(x => x.id == id); let r = m[`review_${p}`].split('|||');
            const n = prompt("Editar:", r[i]); if(n) { r[i] = n; const up = {}; up[`review_${p}`] = r.join('|||'); await _supabase.from('movies').update(up).eq('id', id); loadMovies(); }
        }
        async function toggleW(id, s) { await _supabase.from('movies').update({ watched: s }).eq('id', id); loadMovies(); }
        async function delMov(id) { if(confirm("Excluir?")) { await _supabase.from('movies').delete().eq('id', id); loadMovies(); } }

        // BUSCA TMDB
        document.getElementById('movieInput').oninput = async function() {
            if(this.value.length < 3) return;
            const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${this.value}&language=pt-BR`);
            const d = await r.json();
            const sugg = document.getElementById('suggestions');
            sugg.style.display = 'block';
            sugg.innerHTML = d.results.slice(0,4).map(m => {
                const year = m.release_date ? m.release_date.split('-')[0] : '';
                // Pegar gêneros via IDs (simplificado para exibição)
                return `<div onclick="addMov('${m.title.replace(/'/g,"")}', 'https://image.tmdb.org/t/p/w185${m.poster_path}')" style="padding:12px; cursor:pointer; font-size:0.8rem; border-bottom:1px solid #222">${m.title} (${year})</div>`;
            }).join('');
        }
        async function addMov(t, p) {
            await _supabase.from('movies').insert([{ title: t, poster: p, watched: false }]);
            document.getElementById('suggestions').style.display = 'none'; document.getElementById('movieInput').value = ''; loadMovies();
        }

        // --- ROLETA ---
        function spinRoleta() {
            const genre = document.getElementById('genre-selector').value;
            const avail = cachedMovies.filter(m => !m.watched);
            
            // Nota: O TMDB salva gêneros como string no seu banco ou você quer filtrar por texto? 
            // Como no banco antigo salvamos a string de gêneros, vamos tentar filtrar por texto.
            let filtered = avail;
            if(genre !== 'all') {
                filtered = avail.filter(m => m.genres && m.genres.includes(genre));
            }

            if(filtered.length === 0) return alert("Nenhum filme dessa categoria na sua lista 'Para Ver'!");

            const win = filtered[Math.floor(Math.random() * filtered.length)];
            const resultDiv = document.getElementById('draw-result');
            
            resultDiv.innerHTML = `
                <div style="animation: popIn 0.5s ease; background:#000; padding:15px; border-radius:15px; border:2px solid var(--primary)">
                    <img src="${win.poster}" style="width:120px; border-radius:10px; margin-bottom:10px">
                    <h4 style="margin:5px 0">${win.title}</h4>
                    <p style="font-size:0.7rem; color:#666">${win.genres || ''}</p>
                </div>
            `;
        }

        window.onload = () => {
            loadMessages(); loadMovies();
            _supabase.channel('m').on('postgres_changes', {event:'*', schema:'public', table:'messages'}, loadMessages).subscribe();
            _supabase.channel('mov').on('postgres_changes', {event:'*', schema:'public', table:'movies'}, loadMovies).subscribe();
        };
    </script>
</body>
</html>
