<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Cantinho ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #0d0d0d;
            --sidebar: #161616;
            --card: #1e1e1e;
            --text: #f0f0f0;
            --leo: #2196F3;
            --eme: #ff758f;
            --paper: #fdfcf0;
            --notebook-blue: #a2c2e8;
            --notebook-pink: #ffb3c1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR (PC) / NAVBAR (CELULAR) */
        .sidebar { width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; z-index: 1000; flex-shrink: 0; }
        .logo { font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 1.8rem; margin-bottom: 40px; text-align: center; }
        .nav-group { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { background: transparent; color: #888; border: none; padding: 12px 15px; border-radius: 12px; cursor: pointer; text-align: left; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .nav-btn.active { background: #252525; color: white; border-left: 4px solid var(--primary); }

        /* ÁREA DE CONTEÚDO */
        main { flex: 1; overflow-y: auto; padding: 30px; position: relative; scrollbar-width: none; scroll-behavior: smooth; }
        .section { display: none; max-width: 900px; margin: 0 auto; animation: slideUp 0.4s ease-out; }
        .section.active { display: block; }

        /* CADERNO INÍCIO */
        .notebook-bg { background-color: var(--paper); background-image: linear-gradient(#e1e0d6 1px, transparent 1px); background-size: 100% 30px; border-radius: 20px; height: 400px; padding: 20px; position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,0.1), 5px 5px 15px rgba(0,0,0,0.3); border-left: 25px solid #dcdbb2; overflow: hidden; margin-bottom: 30px; }
        .bilhete { background: #fffb8f; color: #333; padding: 12px; width: 170px; box-shadow: 4px 4px 8px rgba(0,0,0,0.15); font-family: 'Dancing Script', cursive; font-size: 1.1rem; position: absolute; border-radius: 2px; animation: aparecerSumir 12s ease-in-out forwards; display: flex; flex-direction: column; pointer-events: none; }
        .bilhete-meta { font-family: 'Inter'; font-size: 0.6rem; font-weight: 800; margin-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 4px; display: flex; justify-content: space-between; }

        /* CADERNO DE METAS */
        .goals-notebook { background-color: #fbfbf9; background-image: linear-gradient(var(--notebook-blue) 1px, transparent 1px); background-size: 100% 35px; border-radius: 16px; min-height: 490px; padding: 10px 20px 20px 60px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 0 20px rgba(0,0,0,0.05); border: 1px solid #d0cfc4; }
        .goals-notebook::before { content: ''; position: absolute; top: 0; bottom: 0; left: 45px; width: 2px; background: var(--notebook-pink); }
        .notebook-scroll { height: 440px; overflow-y: auto; scrollbar-width: none; }
        .goal-line { display: flex; align-items: center; justify-content: space-between; height: 35px; line-height: 35px; font-family: 'Dancing Script', cursive; font-size: 1.45rem; color: #2c2c2c; padding-right: 10px; }
        .goal-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding-top: 2px; }
        .goal-cb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; border: 2px solid #666; border-radius: 4px; cursor: pointer; position: relative; flex-shrink: 0; outline: none; background: #fff; }
        .goal-cb:checked { background: var(--primary); border-color: var(--primary); }
        .goal-cb:checked::after { content: '✓'; position: absolute; color: white; font-size: 13px; font-weight: bold; top: -5px; left: 1px; font-family: 'Inter'; }
        .goal-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .goal-text.completed { text-decoration: line-through; opacity: 0.4; color: #777; }
        .goal-actions { display: flex; gap: 8px; opacity: 0; transition: 0.2s; }
        .goal-line:hover .goal-actions { opacity: 1; }
        .btn-goal-tool { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 0; color: #777; }
        .btn-goal-tool:hover { color: #000; }

        /* GALERIA DE DESENHOS */
        .art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; list-style: none; padding: 0; margin-top: 20px; }
        .art-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; position: relative; }
        .art-img-container { width: 100%; height: 260px; background: #050505; }
        .art-img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .art-info { padding: 15px; display: flex; flex-direction: column; gap: 5px; }
        .art-title { font-family: 'Dancing Script', cursive; font-size: 1.4rem; color: #fff; margin: 0; }
        .art-author { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* FILMES */
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; list-style: none; padding: 0; margin-top: 20px; }
        .movie-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
        .poster-container { position: relative; width: 100%; height: 320px; background: #000; }
        .poster-img { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        /* CRÍTICAS */
        .critic-section { padding: 10px; font-size: 0.8rem; border-top: 1px solid #333; width: 100%; }
        .stars { font-size: 1.1rem; cursor: pointer; color: #444; margin-bottom: 5px; }
        .star.gold { color: #FFD700; }
        .chat-bubble { background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 5px; word-wrap: break-word; overflow-wrap: break-word; }
        .chat-text { line-height: 1.3; color: #ddd; font-size: 0.8rem; }
        .chat-tools { display: flex; gap: 12px; justify-content: flex-end; opacity: 0.4; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 4px; }
        .chat-tools button { background: none; border: none; color: white; cursor: pointer; font-size: 0.75rem; padding: 2px; }
        .review-input-group { display: flex; gap: 5px; margin-top: 8px; }
        .review-input-group input { flex: 1; background: #000; border: 1px solid #444; color: white; border-radius: 8px; padding: 6px 10px; font-size: 0.75rem; outline: none; }

        /* SUDOKU STYLES */
        .sudoku-container { display: flex; flex-direction: column; gap: 15px; align-items: center; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; margin-top: 15px; }
        .sudoku-scoreboard { display: flex; justify-content: space-around; width: 100%; max-width: 420px; background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; font-weight: bold; font-size: 0.95rem; }
        .sudoku-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: 420px; }
        .sudoku-btn-mode { flex: 1; min-width: 80px; padding: 10px; font-size: 0.8rem; background: #222; color: #aaa; border: 1px solid #444; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; }
        .sudoku-btn-mode.active-tool { background: var(--primary); color: white; border-color: var(--primary); }
        .sudoku-board { display: grid; grid-template-columns: repeat(9, 1fr); width: 100%; max-width: 420px; aspect-ratio: 1; border: 3px solid var(--text); background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .sudoku-cell { display: flex; align-items: center; justify-content: center; border: 1px solid #222; font-size: 1.35rem; font-weight: 800; cursor: pointer; user-select: none; position: relative; aspect-ratio: 1; color: #fff; }
        .sudoku-cell.border-top { border-top: 2.5px solid var(--text); }
        .sudoku-cell.border-left { border-left: 2.5px solid var(--text); }
        .sudoku-cell.clue { background: #1a1a1a; color: #777; cursor: not-allowed; }
        .sudoku-cell.selected { background: rgba(255, 77, 109, 0.25); }
        .sudoku-cell.player-leo { color: var(--leo); text-shadow: 0 0 8px rgba(33, 150, 243, 0.5); }
        .sudoku-cell.player-eme { color: var(--eme); text-shadow: 0 0 8px rgba(255, 117, 143, 0.5); }
        .sudoku-notes-grid { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; font-size: 0.55rem; color: #777; padding: 2px; line-height: 1; pointer-events: none; }
        .sudoku-note-cell { display: flex; align-items: center; justify-content: center; }
        .sudoku-keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 420px; margin-top: 5px; }
        .sudoku-key { background: #222; color: white; border: 1px solid #444; padding: 12px 5px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; font-size: 1.1rem; transition: 0.1s; }
        .sudoku-key:active { background: #333; transform: scale(0.95); }

        /* MOBILE FIXES */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 75px; flex-direction: row; position: fixed; bottom: 0; border-right: none; border-top: 1px solid #222; padding: 0; overflow-x: auto; }
            .logo { display: none; }
            .nav-group { flex-direction: row; width: 100%; gap: 0; height: 100%; }
            .nav-btn { flex: 1; min-width: 75px; flex-direction: column; font-size: 0.65rem; padding: 10px 5px; text-align: center; justify-content: center; align-items: center; gap: 4px; }
            .nav-btn.active { border-left: none; border-top: 3px solid var(--primary); background: transparent; }
            main { padding: 15px 15px 100px 15px; }
            .movie-grid, .art-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .poster-container, .art-img-container { height: 210px; }
            .poster-img, .art-img { object-fit: cover; }
            .notebook-bg { height: 350px; border-left: 15px solid #dcdbb2; }
            .bilhete { width: 135px; font-size: 0.95rem; }
            .goals-notebook { padding: 8px 10px 10px 45px; background-size: 100% 35px; min-height: 400px; }
            .goals-notebook::before { left: 32px; }
            .notebook-scroll { height: 360px; }
            .goal-line { font-size: 1.25rem; }
            .goal-actions { opacity: 1; }
            .sudoku-cell { font-size: 1.1rem; }
        }

        @keyframes aparecerSumir { 0% { opacity: 0; transform: scale(0.5); } 8% { opacity: 1; transform: scale(1) rotate(-2deg); } 92% { opacity: 1; transform: scale(1) rotate(-2deg); } 100% { opacity: 0; transform: translateY(-30px); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Nosso Cantinho ✨</div>
        <nav class="nav-group">
            <button class="nav-btn active" onclick="changeSection('inicio', this)"><span>🏠</span> Início</button>
            <button class="nav-btn" onclick="changeSection('filmes', this)"><span>🍿</span> Filmes</button>
            <button class="nav-btn" onclick="changeSection('metas', this)"><span>📌</span> Metas</button>
            <button class="nav-btn" onclick="changeSection('desenhos', this)"><span>🎨</span> Desenhos</button>
            <button class="nav-btn" onclick="changeSection('sudoku', this)"><span>🧩</span> Sudoku</button>
            <button class="nav-btn" onclick="changeSection('vales', this)"><span>🎟️</span> Vales</button>
        </nav>
    </aside>

    <main>
        <section id="sec-inicio" class="section active">
            <div style="background: rgba(22,22,22,0.9); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333;">
                <textarea id="msg-text" placeholder="Escreva um bilhete fofo..." rows="2" style="width: 100%; background: #000; border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; resize: none;"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="saveMsg('LÉO')" style="flex:1; background:var(--leo); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">LÉO</button>
                    <button onclick="saveMsg('EME')" style="flex:1; background:var(--eme); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">EME</button>
                </div>
            </div>
            <div class="notebook-bg" id="notebook">
                <div style="color:#999; text-align:center; font-family:'Dancing Script'; font-size:1.1rem; margin-top:150px; opacity:0.5;">Os bilhetes flutuam aqui...</div>
            </div>
            <div style="font-family:'Dancing Script'; font-size:1.6rem; color:var(--primary); margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:5px;">📜 Arquivo de Recados</div>
            <div id="msg-list-legacy" style="display:flex; flex-direction:column; gap:10px; padding-bottom: 30px;"></div>
        </section>

        <section id="sec-filmes" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem; color: var(--primary);">Nosso Cinema</h2>
            <div style="display:flex; gap:5px; background:#161616; padding:5px; border-radius:50px; margin-bottom:15px;">
                <button id="btn-mov-todo" class="nav-btn active" style="flex:1; text-align:center; justify-content:center; padding:8px;" onclick="movTab('todo')">Para Ver</button>
                <button id="btn-mov-watched" class="nav-btn" style="flex:1; text-align:center; justify-content:center; padding:8px;" onclick="movTab('watched')">Vistos</button>
                <button id="btn-mov-sorteio" class="nav-btn" style="flex:1; text-align:center; justify-content:center; padding:8px;" onclick="movTab('sorteio')">🎲 Sorteio</button>
            </div>
            <div id="area-filmes-lista">
                <div id="search-container">
                    <input type="text" id="movieInput" placeholder="🔍 Adicionar novo filme..." style="width:100%; background:#1e1e1e; border:1px solid #333; color:white; padding:12px; border-radius:12px; margin-bottom:10px;">
                    <div id="suggestions" style="display:none; background:#222; border-radius:10px; padding:5px; border:1px solid #444; margin-bottom:15px;"></div>
                </div>
                <ul id="list-todo" class="movie-grid"></ul>
                <ul id="list-watched" class="movie-grid" style="display:none"></ul>
            </div>
            <div id="area-filmes-sorteio" style="display:none; text-align:center; background:#1a1a1a; padding:20px; border-radius:15px; border:1px solid #333;">
                <h3>O que vamos ver hoje?</h3>
                <button onclick="spinRoleta()" style="width:100%; padding:15px; background:var(--primary); border:none; border-radius:12px; color:white; font-weight:bold; cursor:pointer;">SORTEAR 🎰</button>
                <div id="draw-result" style="margin-top:20px;"></div>
            </div>
        </section>

        <section id="sec-metas" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem; color: var(--primary);">Nossos Planos & Metas 📌</h2>
            <div style="background: rgba(22,22,22,0.9); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; display: flex; gap: 10px;">
                <input type="text" id="goal-input" placeholder="Nova meta ex: Viajar para Veneza... ✈️" style="flex:1; background:#000; border:1px solid #444; color:white; padding:12px; border-radius:10px; outline:none; font-size:0.9rem;" onkeypress="if(event.key === 'Enter') saveGoal()">
                <button onclick="saveGoal()" style="background:var(--primary); color:white; border:none; padding:0 20px; border-radius:10px; font-weight:bold; cursor:pointer;">Adicionar</button>
            </div>
            <div class="goals-notebook">
                <div class="notebook-scroll" id="goal-list"></div>
            </div>
        </section>

        <section id="sec-desenhos" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem; color: var(--primary);">Nossa Galeria de Arte 🎨</h2>
            
            <div style="background: rgba(22,22,22,0.9); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="art-title-input" placeholder="Título da obra de arte..." style="flex:1; background:#000; border:1px solid #444; color:white; padding:12px; border-radius:10px; outline:none;">
                    <input type="file" id="art-file-input" accept="image/*" style="display:none;" onchange="updateFileLabel()">
                    <button onclick="document.getElementById('art-file-input').click()" id="upload-label-btn" style="background:#333; color:white; border:1px dashed #555; padding:0 15px; border-radius:10px; cursor:pointer; font-size:0.85rem;">📁 Escolher Foto</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="saveDrawing('LÉO')" id="btn-draw-leo" style="flex:1; background:var(--leo); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Postar como LÉO</button>
                    <button onclick="saveDrawing('EME')" id="btn-draw-eme" style="flex:1; background:var(--eme); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Postar como EME</button>
                </div>
            </div>

            <ul id="art-list" class="art-grid"></ul>
        </section>

        <section id="sec-sudoku" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem; color: var(--primary);">Desafio Sudoku 🧩</h2>
            
            <div class="sudoku-container">
                <div class="sudoku-scoreboard">
                    <span style="color: var(--leo);">🏆 LÉO: <span id="score-leo">0</span> pts</span>
                    <span style="color: var(--eme);">🏆 EME: <span id="score-eme">0</span> pts</span>
                </div>

                <div class="sudoku-controls">
                    <button id="sudoku-player-toggle" class="sudoku-btn-mode" onclick="changeSudokuPlayer()" style="border-color: var(--leo); color: #fff; background: rgba(33, 150, 243, 0.1);">Vez de: LÉO</button>
                    <button id="btn-sudoku-notes" class="sudoku-btn-mode" onclick="toggleSudokuNotes()">📝 Anotações: OFF</button>
                    <button class="sudoku-btn-mode" onclick="useSudokuHint()" style="background:#2b2b1a;">💡 Dica (-5 pts)</button>
                </div>

                <div class="sudoku-controls">
                    <button id="btn-diff-facil" class="sudoku-btn-mode active-tool" onclick="generateSudoku('facil')">Fácil</button>
                    <button id="btn-diff-medio" class="sudoku-btn-mode" onclick="generateSudoku('medio')">Médio</button>
                    <button id="btn-diff-dificil" class="sudoku-btn-mode" onclick="generateSudoku('dificil')">Difícil</button>
                </div>

                <div id="sudoku-grid-wrapper" class="sudoku-board"></div>

                <div class="sudoku-keypad">
                    <button class="sudoku-key" onclick="sudokuInput(1)">1</button>
                    <button class="sudoku-key" onclick="sudokuInput(2)">2</button>
                    <button class="sudoku-key" onclick="sudokuInput(3)">3</button>
                    <button class="sudoku-key" onclick="sudokuInput(4)">4</button>
                    <button class="sudoku-key" onclick="sudokuInput(5)">5</button>
                    <button class="sudoku-key" onclick="sudokuInput(6)">6</button>
                    <button class="sudoku-key" onclick="sudokuInput(7)">7</button>
                    <button class="sudoku-key" onclick="sudokuInput(8)">8</button>
                    <button class="sudoku-key" onclick="sudokuInput(9)">9</button>
                    <button class="sudoku-key" onclick="sudokuInput(0)" style="background: #331a1a; color: #ff6666; font-size: 0.9rem;">❌ Apagar</button>
                </div>
            </div>
        </section>

        <section id="sec-vales" class="section"><center><h2 style="font-family:'Dancing Script'">Seus Vales vindo aí... 🎟️</h2></center></section>
    </main>

    <script>
        const SUPABASE_URL = 'https://surcxurqjaelqudeqzic.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmN4dXJxamFlbHF1ZGVxemljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTk2NTYsImV4cCI6MjA4MTQ3NTY1Nn0.Ab0BRqSbqoWyb7A5lQMDNW9iBjb0FBxv27MhnZ8L8tk'; 
        const TMDB_API_KEY = 'c96d86cf59c6c7fb0af651ec5059bcbf';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let cachedMovies = [];

        // Variaveis Globais Sudoku
        let sudokuSelectedCell = null;
        let sudokuNotesMode = false;
        let sudokuActivePlayer = 'LÉO'; 
        let sudokuScores = { LÉO: 0, EME: 0 };
        let sudokuSolution = [];
        let sudokuInitial = [];
        let sudokuCurrent = [];
        let sudokuPlayerMap = []; 
        let sudokuNotesMap = []; 

        function escapeHTML(str) {
            if (!str) return "";
            return String(str).replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        function changeSection(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar .nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            btn.classList.add('active');
            if(id === 'metas') loadGoals();
            if(id === 'desenhos') loadDrawings();
            if(id === 'sudoku') {
                loadSudokuScores();
                if(!sudokuSolution.length) generateSudoku('facil');
            }
        }

        function movTab(t) {
            document.querySelectorAll('#sec-filmes .nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-mov-' + t).classList.add('active');

        function generateSudoku(diff) {
            document.querySelectorAll('#sec-sudoku .sudoku-controls .sudoku-btn-mode').forEach(b => {
                if(b.id.startsWith('btn-diff-')) b.classList.remove('active-tool');
            });
            document.getElementById('btn-diff-' + diff).classList.add('active-tool');

            // Grade estrutural base para embaralhar
            const baseBoard = [
                [1,2,3, 4,5,6, 7,8,9], [4,5,6, 7,8,9, 1,2,3], [7,8,9, 1,2,3, 4,5,6],
                [2,3,1, 5,6,4, 8,9,7], [5,6,4, 8,9,7, 2,3,1], [8,9,7, 2,3,1, 5,6,4],
                [3,1,2, 6,4,5, 9,7,8], [6,4,5, 9,7,8, 3,1,2], [9,7,8, 3,1,2, 6,4,5]
            ];

            // Permuta números aleatoriamente (Mapeamento 1-9 dinâmico)
            let map = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
            let board = baseBoard.map(row => row.map(val => map[val - 1]));

            // Permuta linhas internas de blocos 3x3
            for(let i=0; i<9; i+=3) {
                let rows = [i, i+1, i+2].sort(() => Math.random() - 0.5);
                let copy = [board[i], board[i+1], board[i+2]];
                board[i] = copy[rows[0] - i];
                board[i+1] = copy[rows[1] - i];
                board[i+2] = copy[rows[2] - i];
            }

            sudokuSolution = board.map(row => [...row]);

            // Define quantidade de ocultações com base no nível
            let missing = 35; // Fácil
            if(diff === 'medio') missing = 45;
            if(diff === 'dificil') missing = 54;

            sudokuInitial = board.map(row => [...row]);
            let spots = [];
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) spots.push({r, c});
            }
            spots.sort(() => Math.random() - 0.5);

            for(let i=0; i<missing; i++) {
                sudokuInitial[spots[i].r][spots[i].c] = 0;
            }

            sudokuCurrent = sudokuInitial.map(row => [...row]);
            sudokuPlayerMap = Array(9).fill(0).map(() => Array(9).fill(''));
            sudokuNotesMap = Array(9).fill(0).map(() => Array(9).fill(0).map(() => Array(10).fill(false)));
            sudokuSelectedCell = null;

            renderSudokuBoard();
        }

        function renderSudokuBoard() {
            const wrapper = document.getElementById('sudoku-grid-wrapper');
            if(!wrapper) return;
            wrapper.innerHTML = '';

            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    const val = sudokuCurrent[r][c];
                    const isClue = sudokuInitial[r][c] !== 0;

                    const cell = document.createElement('div');
                    cell.className = 'sudoku-cell';

                    if(r === 3 || r === 6) cell.classList.add('border-top');
                    if(c === 3 || c === 6) cell.classList.add('border-left');

                    if(isClue) {
                        cell.classList.add('clue');
                        cell.innerText = val;
                    } else {
                        if(sudokuSelectedCell && sudokuSelectedCell.r === r && sudokuSelectedCell.c === c) {
                            cell.classList.add('selected');
                        }

                        if(val !== 0) {
                            cell.innerText = val;
                            if(sudokuPlayerMap[r][c] === 'LÉO') cell.classList.add('player-leo');
                            if(sudokuPlayerMap[r][c] === 'EME') cell.classList.add('player-eme');
                        } else {
                            let cellHasNotes = false;
                            for(let n=1; n<=9; n++) { if(sudokuNotesMap[r][c][n]) cellHasNotes = true; }

                            if(cellHasNotes) {
                                const nGrid = document.createElement('div');
                                nGrid.className = 'sudoku-notes-grid';
                                for(let n=1; n<=9; n++) {
                                    const nCell = document.createElement('div');
                                    nCell.className = 'sudoku-note-cell';
                                    if(sudokuNotesMap[r][c][n]) nCell.innerText = n;
                                    nGrid.appendChild(nCell);
                                }
                                cell.appendChild(nGrid);
                            }
                        }

                        cell.onclick = () => {
                            sudokuSelectedCell = {r, c};
                            renderSudokuBoard();
                        };
                    }
                    wrapper.appendChild(cell);
                }
            }
        }

        function sudokuInput(num) {
            if(!sudokuSelectedCell) return;
            const {r, c} = sudokuSelectedCell;
            if(sudokuInitial[r][c] !== 0) return;

            if(num === 0) { // Apagar
                sudokuCurrent[r][c] = 0;
                sudokuPlayerMap[r][c] = '';
                sudokuNotesMap[r][c] = Array(10).fill(false);
                renderSudokuBoard();
                return;
            }

            if(sudokuNotesMode) {
                sudokuCurrent[r][c] = 0;
                sudokuPlayerMap[r][c] = '';
                sudokuNotesMap[r][c][num] = !sudokuNotesMap[r][c][num];
            } else {
                sudokuCurrent[r][c] = num;
                sudokuPlayerMap[r][c] = sudokuActivePlayer;
                sudokuNotesMap[r][c] = Array(10).fill(false);

                if(num === sudokuSolution[r][c]) {
                    sudokuScores[sudokuActivePlayer] += 10;
                    updateSudokuScoreboard();
                    checkSudokuWin();
                } else {
                    sudokuScores[sudokuActivePlayer] = Math.max(0, sudokuScores[sudokuActivePlayer] - 15);
                    updateSudokuScoreboard();
                    alert(`Opa! O número ${num} está incorreto nesta célula. Erros custam -15 pontos.`);
                }
            }
            renderSudokuBoard();
        }

        function useSudokuHint() {
            if(!sudokuSelectedCell) return alert("Selecione uma célula vazia para preencher com a dica!");
            const {r, c} = sudokuSelectedCell;
            if(sudokuInitial[r][c] !== 0) return;

            const correct = sudokuSolution[r][c];
            sudokuCurrent[r][c] = correct;
            sudokuPlayerMap[r][c] = sudokuActivePlayer;
            sudokuNotesMap[r][c] = Array(10).fill(false);

            sudokuScores[sudokuActivePlayer] = Math.max(0, sudokuScores[sudokuActivePlayer] - 5);
            updateSudokuScoreboard();

            renderSudokuBoard();
            checkSudokuWin();
        }

        function checkSudokuWin() {
            for(let r=0; r<9; r++) {
                for(let c=0; c<9; c++) {
                    if(sudokuCurrent[r][c] !== sudokuSolution[r][c]) return;
                }
            }
            sudokuScores[sudokuActivePlayer] += 100;
            updateSudokuScoreboard();
            alert(`🎉 INCRÍVEL! Vocês desvendaram o tabuleiro juntos! Bônus de 100 pontos para ${sudokuActivePlayer}! 🏆`);
        }

        function updateSudokuScoreboard() {
            document.getElementById('score-leo').innerText = sudokuScores.LÉO;
            document.getElementById('score-eme').innerText = sudokuScores.EME;
            localStorage.setItem('sudoku_scores_v1', JSON.stringify(sudokuScores));
        }

        function loadSudokuScores() {
            const saved = localStorage.getItem('sudoku_scores_v1');
            if(saved) sudokuScores = JSON.parse(saved);
            updateSudokuScoreboard();
        }

        window.onload = () => {
            loadLegacyList(); loadMovies(); loadGoals(); loadDrawings();
            _supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(5).then(({data}) => {
                if(data) data.reverse().forEach((m, i) => setTimeout(() => createBilhete(m), i * 2500));
            });
            _supabase.channel('global').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => {
                createBilhete(p.new); loadLegacyList();
            }).on('postgres_changes', {event:'*', schema:'public', table:'messages'}, loadLegacyList)
            .on('postgres_changes', {event:'*', schema:'public', table:'movies'}, loadMovies)
            .on('postgres_changes', {event:'*', schema:'public', table:'goals'}, loadGoals)
            .on('postgres_changes', {event:'*', schema:'public', table:'drawings'}, loadDrawings).subscribe();
        };
    </script>
</body>
</html>
