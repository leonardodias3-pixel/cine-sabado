<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #0d0d0d;
            --sidebar: #161616;
            --card: #1e1e1e;
            --text: #f0f0f0;
            --leo: #2196F3;
            --eme: #ff758f;
            --paper: #fdfcf0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; }
        .logo { font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 1.8rem; margin-bottom: 40px; text-align: center; }
        .nav-group { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { background: transparent; color: #888; border: none; padding: 12px 15px; border-radius: 12px; cursor: pointer; text-align: left; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-btn.active { background: #252525; color: white; border-left: 4px solid var(--primary); }

        main { flex: 1; overflow-y: auto; padding: 30px; position: relative; scrollbar-width: none; scroll-behavior: smooth; }
        .section { display: none; max-width: 800px; margin: 0 auto; animation: slideUp 0.5s ease-out; }
        .section.active { display: block; }

        /* MURAL E CADERNO */
        .notebook-bg {
            background-color: var(--paper);
            background-image: linear-gradient(#e1e0d6 1px, transparent 1px);
            background-size: 100% 30px;
            border-radius: 20px;
            height: 500px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.1), 5px 5px 15px rgba(0,0,0,0.3);
            border-left: 25px solid #dcdbb2;
            overflow: hidden;
            margin-bottom: 50px;
        }

        .bilhete {
            background: #fffb8f;
            color: #333;
            padding: 12px;
            width: 180px;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.15);
            font-family: 'Dancing Script', cursive;
            font-size: 1.2rem;
            position: absolute;
            border-radius: 2px;
            animation: aparecerSumir 12s ease-in-out forwards;
            display: flex;
            flex-direction: column;
            z-index: 5;
        }
        .bilhete:nth-child(even) { background: #ffcfdf; }
        .bilhete-meta { font-family: 'Inter'; font-size: 0.6rem; font-weight: 800; margin-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 4px; display: flex; justify-content: space-between; }

        /* LISTA DE MENSAGENS (ESTILO ANTIGO) */
        .archive-title { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: var(--primary); margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .msg-list-legacy { display: flex; flex-direction: column; gap: 10px; padding-bottom: 50px; }
        .msg-item { background: var(--card); padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .msg-content { flex: 1; }
        .msg-tools { display: flex; gap: 10px; margin-left: 15px; }
        .btn-tool { background: none; border: none; cursor: pointer; font-size: 1rem; opacity: 0.6; transition: 0.3s; }
        .btn-tool:hover { opacity: 1; transform: scale(1.1); }

        .msg-controls { background: rgba(22,22,22,0.9); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .msg-controls textarea { width: 100%; background: #000; border: 1px solid #444; color: white; padding: 12px; border-radius: 10px; resize: none; font-size: 1rem; }

        @keyframes aparecerSumir {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            8% { opacity: 1; transform: scale(1) rotate(-2deg); }
            92% { opacity: 1; transform: scale(1) rotate(-2deg); }
            100% { opacity: 0; transform: scale(0.8) translateY(-30px); }
        }

        @media (max-width: 768px) {
            .sidebar { width: 100%; height: 70px; flex-direction: row; position: fixed; bottom: 0; border-top: 1px solid #222; justify-content: space-around; z-index: 1000; padding: 0; }
            .logo { display: none; }
            main { padding: 15px 15px 90px 15px; }
            .bilhete { width: 140px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Nosso Cantinho ✨</div>
        <nav class="nav-group">
            <button class="nav-btn active" onclick="nav('inicio', this)"><span>🏠</span> Início</button>
            <button class="nav-btn" onclick="nav('filmes', this)"><span>🍿</span> Filmes</button>
            <button class="nav-btn" onclick="nav('desenhos', this)"><span>🎨</span> Desenhos</button>
            <button class="nav-btn" onclick="nav('vales', this)"><span>🎟️</span> Vales</button>
        </nav>
    </aside>

    <main id="main-scroll">
        <!-- SEÇÃO INÍCIO -->
        <section id="sec-inicio" class="section active">
            <div class="msg-controls">
                <textarea id="msg-text" placeholder="Escreva um bilhete para nós..." rows="2"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="saveMsg('LÉO')" style="flex:1; background:var(--leo); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">LÉO</button>
                    <button onclick="saveMsg('EME')" style="flex:1; background:var(--eme); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">EME</button>
                </div>
            </div>

            <!-- Mural Animado -->
            <div class="notebook-bg" id="notebook">
                <div style="color:#999; text-align:center; font-family:'Dancing Script'; font-size:1.2rem; margin-top:200px; opacity:0.5;">
                    Os bilhetes recentes flutuam aqui...
                </div>
            </div>

            <!-- Arquivo Histórico -->
            <div class="archive-title">📜 Arquivo de Recados</div>
            <div id="msg-list-legacy" class="msg-list-legacy">
                <!-- Lista para editar e excluir aqui -->
            </div>
        </section>

        <!-- SEÇÃO FILMES -->
        <section id="sec-filmes" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem;">Nosso Cinema</h2>
            <div style="display:flex; gap:5px; background:#161616; padding:5px; border-radius:50px; margin-bottom:20px;">
                <button class="nav-btn" style="flex:1; text-align:center; justify-content:center;" onclick="movTab('todo')">Para Ver</button>
                <button class="nav-btn" style="flex:1; text-align:center; justify-content:center;" onclick="movTab('watched')">Já Vistos</button>
                <button class="nav-btn" style="flex:1; text-align:center; justify-content:center;" onclick="movTab('sorteio')">🎲 Sorteio</button>
            </div>
            <div id="filmes-lista">
                <ul id="list-todo" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; list-style:none; padding:0;"></ul>
                <ul id="list-watched" style="display:none; grid-template-columns:1fr 1fr; gap:10px; list-style:none; padding:0;"></ul>
            </div>
            <div id="filmes-sorteio" style="display:none; text-align:center;">
                <button onclick="spinRoleta()" style="width:100%; padding:15px; background:var(--primary); border:none; border-radius:12px; color:white; font-weight:bold;">SORTEAR 🎰</button>
                <div id="draw-result" style="margin-top:20px;"></div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://surcxurqjaelqudeqzic.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmN4dXJxamFlbHF1ZGVxemljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTk2NTYsImV4cCI6MjA4MTQ3NTY1Nn0.Ab0BRqSbqoWyb7A5lQMDNW9iBjb0FBxv27MhnZ8L8tk'; 
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        function nav(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            btn.classList.add('active');
        }

        // --- MENSAGENS E CADERNO ---
        async function saveMsg(author) {
            const input = document.getElementById('msg-text');
            if(!input.value.trim()) return;
            await _supabase.from('messages').insert([{ text: input.value, author }]);
            input.value = '';
            loadLegacyList();
        }

        async function loadLegacyList() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('msg-list-legacy');
            list.innerHTML = data.map(m => `
                <div class="msg-item" style="border-color: ${m.author === 'LÉO' ? 'var(--leo)' : 'var(--eme)'}">
                    <div class="msg-content">
                        <small style="color:${m.author === 'LÉO' ? 'var(--leo)' : 'var(--eme)'}; font-weight:800;">${m.author}</small>
                        <div style="margin:5px 0;">${m.text}</div>
                        <small style="opacity:0.3; font-size:0.6rem;">${new Date(m.created_at).toLocaleString('pt-BR')}</small>
                    </div>
                    <div class="msg-tools">
                        <button class="btn-tool" onclick="editMsg('${m.id}', \`${m.text}\`)">✏️</button>
                        <button class="btn-tool" onclick="delMsg('${m.id}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function createBilhete(msgObj) {
            const notebook = document.getElementById('notebook');
            const bilhete = document.createElement('div');
            bilhete.className = 'bilhete';
            
            const x = Math.random() * (notebook.offsetWidth - 200);
            const y = Math.random() * (notebook.offsetHeight - 120);
            const rot = (Math.random() * 10) - 5;
            
            const time = new Date(msgObj.created_at).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
            const date = new Date(msgObj.created_at).toLocaleDateString('pt-BR', {day: '2-digit', month:'2-digit'});

            bilhete.style.left = x + 'px';
            bilhete.style.top = y + 'px';
            bilhete.style.transform = `rotate(${rot}deg)`;
            
            bilhete.innerHTML = `
                <div style="flex:1;">${msgObj.text}</div>
                <div class="bilhete-meta">
                    <span>${msgObj.author}</span>
                    <span>${date} - ${time}</span>
                </div>
            `;
            
            notebook.appendChild(bilhete);
            setTimeout(() => bilhete.remove(), 12000);
        }

        async function delMsg(id) { if(confirm("Apagar recado permanentemente?")) { await _supabase.from('messages').delete().eq('id', id); loadLegacyList(); } }
        async function editMsg(id, old) { const n = prompt("Editar recado:", old); if(n) { await _supabase.from('messages').update({ text: n }).eq('id', id); loadLegacyList(); } }

        // --- INICIALIZAÇÃO E REALTIME ---
        window.onload = () => {
            loadLegacyList();
            // Carrega alguns bilhetes iniciais para o caderno
            _supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(5).then(({data}) => {
                data.reverse().forEach((m, i) => setTimeout(() => createBilhete(m), i * 2500));
            });

            // Escuta novas mensagens em tempo real
            _supabase.channel('m-realtime').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload => {
                createBilhete(payload.new);
                loadLegacyList();
            }).on('postgres_changes', {event:'*', schema:'public', table:'messages'}, loadLegacyList).subscribe();
        };

        // Funções de Filme simplificadas para manter o código limpo
        function movTab(t) {
            document.getElementById('list-todo').style.display = t === 'todo' ? 'grid' : 'none';
            document.getElementById('list-watched').style.display = t === 'watched' ? 'grid' : 'none';
            document.getElementById('filmes-sorteio').style.display = t === 'sorteio' ? 'block' : 'none';
            document.getElementById('filmes-lista').style.display = t === 'sorteio' ? 'none' : 'block';
        }
    </script>
</body>
</html>
