<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho 💖</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #E50914;
            --bg: #141414;
            --card: #1f1f1f;
            --text: #ffffff;
            --accent-leo: #2196F3;
            --accent-emi: #E91E63;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .container { width: 100%; max-width: 500px; }

        /* NAVEGAÇÃO PRINCIPAL */
        .main-nav { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 25px; 
            overflow-x: auto; 
            padding: 5px;
            width: 100%;
            scrollbar-width: none;
        }
        .nav-btn { 
            background: #2a2a2a; 
            color: #888; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            white-space: nowrap;
        }
        .nav-btn.active { 
            background: var(--primary); 
            color: white;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3); 
        }

        .section { display: none; animation: fadeIn 0.3s ease; }
        .section.active { display: block; }

        /* ABA INÍCIO (MENSAGENS) */
        .msg-input-card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid #333; 
        }
        .msg-input-card textarea { 
            width: 100%; 
            background: #000; 
            border: 1px solid #444; 
            color: white; 
            padding: 12px; 
            border-radius: 10px; 
            resize: none; 
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-post {
            flex: 1; 
            padding: 12px; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-post:active { transform: scale(0.95); }

        .msg-list { display: flex; flex-direction: column; gap: 12px; }
        .msg-card { 
            background: var(--card); 
            padding: 15px; 
            border-radius: 12px; 
            position: relative; 
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s ease;
        }
        .msg-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .msg-author { font-weight: 900; font-size: 0.8em; text-transform: uppercase; }
        .msg-date { font-size: 0.7em; color: #666; margin-top: 8px; display: block; }
        .msg-tools { display: flex; gap: 10px; }
        .tool-btn { background: none; border: none; cursor: pointer; font-size: 1.1em; opacity: 0.5; padding: 0; }
        .tool-btn:hover { opacity: 1; }

        /* ESTILOS DE FILMES (RESUMIDOS) */
        .movie-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; list-style: none; padding: 0; }
        .movie-card { background: var(--card); border-radius: 10px; overflow: hidden; position: relative; }
        .poster-img { width: 100%; height: 230px; object-fit: cover; display: block; }
        .movie-info { padding: 8px; font-size: 0.85em; text-align: center; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align: center; color: var(--primary); font-size: 1.4em;">❤️ NOSSO CANTINHO</h1>

        <!-- Menu Principal -->
        <nav class="main-nav">
            <button class="nav-btn active" onclick="changeSection('inicio', this)">🏠 Início</button>
            <button class="nav-btn" onclick="changeSection('filmes', this)">🎬 Filmes</button>
            <button class="nav-btn" onclick="changeSection('desenhos', this)">🎨 Desenhos</button>
            <button class="nav-btn" onclick="changeSection('vales', this)">🎟️ Vales</button>
        </nav>

        <!-- SEÇÃO INÍCIO -->
        <section id="sec-inicio" class="section active">
            <div class="msg-input-card">
                <textarea id="msg-text" placeholder="Escreva um recadinho..." rows="2"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="saveMessage('LÉO')" class="btn-post" style="background: var(--accent-leo)">Léo</button>
                    <button onclick="saveMessage('EMI')" class="btn-post" style="background: var(--accent-emi)">Emi</button>
                </div>
            </div>
            <div id="msg-list" class="msg-list">
                <!-- Mensagens carregadas aqui -->
            </div>
        </section>

        <!-- SEÇÃO FILMES -->
        <section id="sec-filmes" class="section">
            <p style="text-align: center; color: #666; font-size: 0.9em;">Seus filmes continuam aqui! 👇</p>
            <ul id="list-todo" class="movie-grid"></ul>
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            <ul id="list-watched" class="movie-grid"></ul>
        </section>

        <!-- SEÇÕES VAZIAS POR ENQUANTO -->
        <section id="sec-desenhos" class="section"><p style="text-align:center; color:#444; margin-top:50px;">Em breve... 🎨</p></section>
        <section id="sec-vales" class="section"><p style="text-align:center; color:#444; margin-top:50px;">Em breve... 🎟️</p></section>

    </div>

    <script>
        // CONFIGURAÇÕES SUPABASE
        const SUPABASE_URL = 'https://surcxurqjaelqudeqzic.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmN4dXJxamFlbHF1ZGVxemljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTk2NTYsImV4cCI6MjA4MTQ3NTY1Nn0.Ab0BRqSbqoWyb7A5lQMDNW9iBjb0FBxv27MhnZ8L8tk'; 
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // TROCA DE SEÇÕES
        function changeSection(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            btn.classList.add('active');
        }

        // --- GERENCIAMENTO DE MENSAGENS ---
        async function saveMessage(author) {
            const textArea = document.getElementById('msg-text');
            const text = textArea.value.trim();
            if(!text) return;

            const { error } = await _supabase.from('messages').insert([{ text, author }]);
            if(!error) {
                textArea.value = '';
                loadMessages();
            }
        }

        async function loadMessages() {
            const { data, error } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            if(error) return;

            const list = document.getElementById('msg-list');
            list.innerHTML = data.map(m => `
                <div class="msg-card" style="border-color: ${m.author === 'LÉO' ? 'var(--accent-leo)' : 'var(--accent-emi)'}">
                    <div class="msg-header">
                        <span class="msg-author" style="color: ${m.author === 'LÉO' ? 'var(--accent-leo)' : 'var(--accent-emi)'}">${m.author}</span>
                        <div class="msg-tools">
                            <button class="tool-btn" onclick="editMessage('${m.id}', \`${m.text}\`)">✏️</button>
                            <button class="tool-btn" onclick="deleteMessage('${m.id}')">🗑️</button>
                        </div>
                    </div>
                    <div class="msg-body">${m.text}</div>
                    <span class="msg-date">${new Date(m.created_at).toLocaleString('pt-BR')}</span>
                </div>
            `).join('');
        }

        async function deleteMessage(id) {
            if(confirm("Deseja apagar este recado?")) {
                await _supabase.from('messages').delete().eq('id', id);
                loadMessages();
            }
        }

        async function editMessage(id, oldText) {
            const newText = prompt("Edite seu recado:", oldText);
            if(newText !== null && newText.trim() !== "") {
                await _supabase.from('messages').update({ text: newText }).eq('id', id);
                loadMessages();
            }
        }

        // --- CARREGAR FILMES (Sua lista existente) ---
        async function loadMovies() {
            const { data } = await _supabase.from('movies').select('*').order('created_at', { ascending: false });
            if(!data) return;

            const todo = document.getElementById('list-todo');
            const watched = document.getElementById('list-watched');
            todo.innerHTML = ''; watched.innerHTML = '';

            data.forEach(m => {
                const html = `
                    <li class="movie-card">
                        <img src="${m.poster}" class="poster-img" style="${m.watched ? 'filter:grayscale(1); opacity:0.5' : ''}">
                        <div class="movie-info">${m.title}</div>
                    </li>
                `;
                if(m.watched) watched.innerHTML += html;
                else todo.innerHTML += html;
            });
        }

        // INICIALIZAÇÃO
        window.onload = () => {
            loadMessages();
            loadMovies();

            // Ativa o Realtime para atualizar as mensagens sozinho se o outro postar
            _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, loadMessages)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'movies' }, loadMovies)
            .subscribe();
        };
    </script>
</body>
</html>
