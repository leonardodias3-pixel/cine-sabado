<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cantinho ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #0d0d0d;
            --sidebar: #161616;
            --card: #1e1e1e;
            --text: #f0f0f0;
            --leo: #2196F3;
            --eme: #ff758f;
            --paper: #fdfcf0; /* Cor de papel antigo */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar { width: 240px; background: var(--sidebar); display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #222; }
        .logo { font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 1.8rem; margin-bottom: 40px; text-align: center; }
        .nav-group { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn {
            background: transparent; color: #888; border: none; padding: 12px 15px; border-radius: 12px;
            cursor: pointer; text-align: left; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .nav-btn.active { background: #252525; color: white; border-left: 4px solid var(--primary); }

        /* MAIN */
        main { flex: 1; overflow-y: auto; padding: 30px; position: relative; scrollbar-width: none; }
        .section { display: none; max-width: 800px; margin: 0 auto; animation: slideUp 0.5s ease-out; }
        .section.active { display: block; }

        /* ESTILO CADERNO (INÍCIO) */
        .notebook-bg {
            background-color: var(--paper);
            background-image: linear-gradient(#e1e0d6 1px, transparent 1px);
            background-size: 100% 30px;
            border-radius: 20px;
            min-height: 80vh;
            padding: 40px 20px;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1), 5px 5px 20px rgba(0,0,0,0.3);
            border-left: 30px solid #dcdbb2; /* Espiral/Margem */
            overflow: hidden;
        }

        /* BILHETINHOS */
        .bilhete {
            background: #fffb8f; /* Amarelo Post-it */
            color: #333;
            padding: 15px;
            width: 200px;
            min-height: 100px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
            font-family: 'Dancing Script', cursive;
            font-size: 1.3rem;
            position: absolute;
            transform: rotate(-2deg);
            cursor: pointer;
            border-radius: 2px;
            animation: aparecerSumir 10s ease-in-out forwards; /* Duração do bilhete na tela */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bilhete:nth-child(even) { background: #ffcfdf; transform: rotate(3deg); }
        .bilhete:nth-child(3n) { background: #cfffe5; transform: rotate(-1deg); }

        .bilhete-author { font-size: 0.7rem; font-family: 'Inter'; font-weight: 800; text-transform: uppercase; align-self: flex-end; opacity: 0.5; }

        @keyframes aparecerSumir {
            0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            10% { opacity: 1; transform: scale(1) rotate(-2deg); }
            90% { opacity: 1; transform: scale(1) rotate(-2deg); }
            100% { opacity: 0; transform: scale(0.8) translateY(-20px); }
        }

        /* INPUT FIXO NO TOPO DO CADERNO */
        .msg-controls {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #333;
            z-index: 10;
            position: relative;
        }
        .msg-controls textarea { width: 100%; background: #000; border: 1px solid #444; color: white; padding: 10px; border-radius: 10px; resize: none; }

        /* FILMES (Igual ao anterior) */
        .sub-nav-filmes { display: flex; gap: 8px; margin-bottom: 20px; background: #161616; padding: 5px; border-radius: 50px; }
        .sub-nav-btn { flex: 1; border: none; background: transparent; color: #666; padding: 10px; border-radius: 40px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .sub-nav-btn.active { background: #333; color: white; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; list-style: none; padding: 0; }
        .movie-card { background: var(--card); border-radius: 15px; overflow: hidden; border: 1px solid #2a2a2a; }
        .poster-img { width: 100%; height: 260px; object-fit: cover; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; position: fixed; bottom: 0; border-top: 1px solid #222; justify-content: space-around; z-index: 1000; padding: 0; }
            .logo { display: none; }
            main { padding: 10px 10px 90px 10px; }
            .movie-grid { grid-template-columns: 1fr 1fr; }
            .bilhete { width: 150px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Nosso Cantinho ✨</div>
        <nav class="nav-group">
            <button class="nav-btn active" onclick="nav('inicio', this)"><span>🏠</span> Início</button>
            <button class="nav-btn" onclick="nav('filmes', this)"><span>🍿</span> Filmes</button>
            <button class="nav-btn" onclick="nav('desenhos', this)"><span>🎨</span> Desenhos</button>
            <button class="nav-btn" onclick="nav('vales', this)"><span>🎟️</span> Vales</button>
        </nav>
    </aside>

    <main>
        <!-- SEÇÃO INÍCIO -->
        <section id="sec-inicio" class="section active">
            <div class="msg-controls">
                <textarea id="msg-text" placeholder="Escreva um bilhete para o caderno..." rows="2"></textarea>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button onclick="saveMsg('LÉO')" style="flex:1; background:var(--leo); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">LÉO</button>
                    <button onclick="saveMsg('EME')" style="flex:1; background:var(--eme); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">EME</button>
                </div>
            </div>

            <div class="notebook-bg" id="notebook">
                <!-- Bilhetes vão aparecer aqui espalhados -->
                <p style="color:#999; text-align:center; font-family:'Dancing Script'; font-size:1.5rem; margin-top:100px;">
                    As mensagens recentes aparecerão aqui como bilhetes...
                </p>
            </div>
        </section>

        <!-- SEÇÃO FILMES -->
        <section id="sec-filmes" class="section">
            <h2 style="font-family: 'Dancing Script'; font-size: 2rem;">Nosso Cinema</h2>
            <div class="sub-nav-filmes">
                <button class="sub-nav-btn active" onclick="movTab('todo', this)">Para Ver</button>
                <button class="sub-nav-btn" onclick="movTab('watched', this)">Já Vistos</button>
                <button class="sub-nav-btn" onclick="movTab('sorteio', this)">🎲 Sorteio</button>
            </div>
            <div id="filmes-lista-area">
                <input type="text" id="movieInput" placeholder="🔍 Adicionar novo filme..." style="width:100%; background:#1e1e1e; border:1px solid #333; color:white; padding:15px; border-radius:15px; margin-bottom:20px;">
                <div id="suggestions" style="display:none; background:#1e1e1e; border-radius:12px; padding:10px; border:1px solid #333;"></div>
                <ul id="list-todo" class="movie-grid"></ul>
                <ul id="list-watched" class="movie-grid" style="display:none"></ul>
            </div>
            <div id="filmes-sorteio-area" style="display:none">
                <select id="genre-selector" style="width:100%; padding:15px; background:#1e1e1e; color:white; border-radius:12px; margin-bottom:15px;">
                    <option value="all">🎲 Todos os Gêneros</option>
                    <option value="Terror">Terror</option><option value="Romance">Romance</option><option value="Animação">Animação</option>
                </select>
                <button onclick="spinRoleta()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:bold;">GIRAR ROLETA 🎰</button>
                <div id="draw-result" style="margin-top:20px;"></div>
            </div>
        </section>

        <section id="sec-desenhos" class="section"><center><h2>Galeria 🎨</h2></center></section>
        <section id="sec-vales" class="section"><center><h2>Vales 🎟️</h2></center></section>
    </main>

    <script>
        const SUPABASE_URL = 'https://surcxurqjaelqudeqzic.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmN4dXJxamFlbHF1ZGVxemljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4OTk2NTYsImV4cCI6MjA4MTQ3NTY1Nn0.Ab0BRqSbqoWyb7A5lQMDNW9iBjb0FBxv27MhnZ8L8tk'; 
        const TMDB_API_KEY = 'c96d86cf59c6c7fb0af651ec5059bcbf';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let cachedMovies = [];
        let bilheteQueue = [];

        function nav(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            btn.classList.add('active');
        }

        function movTab(t, btn) {
            document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('filmes-lista-area').style.display = t === 'sorteio' ? 'none' : 'block';
            document.getElementById('filmes-sorteio-area').style.display = t === 'sorteio' ? 'block' : 'none';
            if(t !== 'sorteio') {
                document.getElementById('list-todo').style.display = t === 'todo' ? 'grid' : 'none';
                document.getElementById('list-watched').style.display = t === 'watched' ? 'grid' : 'none';
            }
        }

        // --- LÓGICA DO CADERNO DE BILHETES ---
        async function saveMsg(author) {
            const input = document.getElementById('msg-text');
            if(!input.value.trim()) return;
            await _supabase.from('messages').insert([{ text: input.value, author }]);
            input.value = '';
        }

        async function fetchInitialMessages() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(10);
            if(data) {
                // Mostra as últimas mensagens uma por uma com delay
                data.reverse().forEach((m, i) => {
                    setTimeout(() => createBilhete(m), i * 3000);
                });
            }
        }

        function createBilhete(msgObj) {
            const notebook = document.getElementById('notebook');
            const bilhete = document.createElement('div');
            bilhete.className = 'bilhete';
            
            // Posição aleatória dentro do caderno
            const x = Math.random() * (notebook.offsetWidth - 220);
            const y = Math.random() * (notebook.offsetHeight - 150);
            
            bilhete.style.left = x + 'px';
            bilhete.style.top = y + 'px';
            
            bilhete.innerHTML = `
                <div>${msgObj.text}</div>
                <div class="bilhete-author">${msgObj.author}</div>
            `;
            
            notebook.appendChild(li = bilhete);
            
            // Remove do DOM após a animação de 10s
            setTimeout(() => bilhete.remove(), 10000);
        }

        // --- FILMES ---
        async function loadMovies() {
            const { data } = await _supabase.from('movies').select('*').order('created_at', { ascending: false });
            cachedMovies = data || [];
            const todo = document.getElementById('list-todo');
            const watched = document.getElementById('list-watched');
            todo.innerHTML = ''; watched.innerHTML = '';

            cachedMovies.forEach(m => {
                const li = document.createElement('li'); li.className = 'movie-card';
                if(m.watched) {
                    li.innerHTML = `<img src="${m.poster}" class="poster-img" style="opacity:0.3"><div style="padding:10px; font-size:0.8rem;">${m.title}</div><button onclick="toggleW('${m.id}', false)" style="width:100%; background:#222; color:white; border:none; padding:5px; cursor:pointer">↩</button>`;
                    watched.appendChild(li);
                } else {
                    li.innerHTML = `<img src="${m.poster}" class="poster-img"><div style="padding:10px; font-size:0.8rem;">${m.title}</div><div style="display:flex"><button onclick="toggleW('${m.id}', true)" style="flex:1; padding:10px; background:transparent; color:white; border:none; border-right:1px solid #333; cursor:pointer">✔️</button><button onclick="delMov('${m.id}')" style="flex:1; padding:10px; background:transparent; color:white; border:none; cursor:pointer">🗑️</button></div>`;
                    todo.appendChild(li);
                }
            });
        }
        async function toggleW(id, s) { await _supabase.from('movies').update({ watched: s }).eq('id', id); loadMovies(); }
        async function delMov(id) { if(confirm("Excluir?")) { await _supabase.from('movies').delete().eq('id', id); loadMovies(); } }

        // BUSCA TMDB
        document.getElementById('movieInput').oninput = async function() {
            if(this.value.length < 3) return;
            const r = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${this.value}&language=pt-BR`);
            const d = await r.json();
            const sugg = document.getElementById('suggestions'); sugg.style.display = 'block';
            sugg.innerHTML = d.results.slice(0,4).map(m => `<div onclick="addMov('${m.title.replace(/'/g,"")}', 'https://image.tmdb.org/t/p/w185${m.poster_path}')" style="padding:10px; cursor:pointer; font-size:0.8rem;">${m.title}</div>`).join('');
        }
        async function addMov(t, p) {
            await _supabase.from('movies').insert([{ title: t, poster: p, watched: false }]);
            document.getElementById('suggestions').style.display = 'none'; document.getElementById('movieInput').value = ''; loadMovies();
        }

        window.onload = () => {
            loadMovies();
            fetchInitialMessages();
            // Escuta novas mensagens em tempo real para criar o bilhete na hora
            _supabase.channel('m-channel').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload => {
                createBilhete(payload.new);
            }).subscribe();
        };
    </script>
</body>
</html>
